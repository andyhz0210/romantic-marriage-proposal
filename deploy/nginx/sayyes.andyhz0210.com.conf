# Port 80 serves HTTP directly; port 8080 supports the existing frontend setup.
# Port 443 is currently owned by Xray; configure its TLS routing separately.
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    server_name sayyes.andyhz0210.com;

    root /home/andy/web/sayyes.andyhz0210.com;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Revalidate the entry page when publishing a new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Includes hashed JS, CSS, fonts and the offline export runtime JSON.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/sayyes_access.log;
    error_log /var/log/nginx/sayyes_error.log;
}

